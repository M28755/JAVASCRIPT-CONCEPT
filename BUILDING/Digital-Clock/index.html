<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock-card" role="timer" aria-label="Digital timere">
        <div class="clock-display">
            <div class="time-digits" id="hours">00</div>

             <div class="separator" id="separator">:</div>

             <div class="time-digits" id="minutes">00</div>

             <div class="separator" id="separator">:</div>

             <div class="time-digits" id="seconds">00</div>


        <span class="period" id="ampm">AM</span>
        </div>

        <div class="date-row">
            <span id="dateDisplay">Monday, 1 Jan 2026</span>
        </div>

    </div>
    
</body>
<script src="script.js"></script>
</html>
