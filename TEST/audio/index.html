<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser-Native Transcription to File</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-right: 10px; }
        #textbox { width: 100%; height: 200px; margin-top: 20px; padding: 10px; box-sizing: border-box; }
        .status { color: #555; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Native Transcription Tool</h1>
    <button id="toggleBtn">Start Recording</button>
    <button id="downloadBtn" disabled>Download Text File</button>
    
    <div class="status" id="statusText">Status: Idle</div>
    <textarea id="textbox" placeholder="Your live transcription will appear here..."></textarea>

    <script>
        // Cross-browser normalization for speech recognition interface
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("The Web Speech API is not supported in this browser. Please try Google Chrome or MS Edge.");
        } else {
            const recognition = new SpeechRecognition();
            
            // Critical Configuration Configurations
            recognition.continuous = true;          // Keep capturing audio until manually stopped
            recognition.interimResults = true;       // Process live unconfirmed text chunks
            recognition.lang = 'en-US';              // Target default transcription dialect

            // DOM Element References
            const toggleBtn = document.getElementById('toggleBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const textbox = document.getElementById('textbox');
            const statusText = document.getElementById('statusText');

            let isRecording = false;
            let finalTranscript = '';

            // Handle the stream of incoming structural words
            recognition.onresult = (event) => {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                // Live rendering inside the visible user workspace
                textbox.value = finalTranscript + interimTranscript;
            };

            // Error Management Blocks
            recognition.onerror = (event) => {
                statusText.textContent = `Error encountered: ${event.error}`;
                stopRecognitionSession();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Re-instantiate service if browser cuts off due to silence dropouts
                    recognition.start();
                } else {
                    statusText.textContent = "Status: Session finished.";
                }
            };

            // Toggle Audio Streaming Event Contexts
            toggleBtn.addEventListener('click', () => {
                if (!isRecording) {
                    recognition.start();
                    isRecording = true;
                    toggleBtn.textContent = 'Stop Recording';
                    statusText.textContent = 'Status: Listening to mic...';
                    downloadBtn.disabled = true;
                } else {
                    stopRecognitionSession();
                }
            });

            function stopRecognitionSession() {
                isRecording = false;
                recognition.stop();
                toggleBtn.textContent = 'Start Recording';
                if (textbox.value.trim().length > 0) {
                    downloadBtn.disabled = false;
                }
            }

            // Client-Side Native File Generator Pipeline
            downloadBtn.addEventListener('click', () => {
                const textOutput = textbox.value;
                
                // Package structural text payload directly into browser memory
                const blob = new Blob([textOutput], { type: 'text/plain;charset=utf-8' });
                const exportUrl = URL.createObjectURL(blob);
                
                // Mock link generation to force local device file downloading
                const downloadLink = document.createElement('a');
                downloadLink.href = exportUrl;
                downloadLink.download = `transcription_${Date.now()}.txt`;
                
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                // Cleanup browser DOM and clear allocation pointers
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(exportUrl);
            });
        }
    </script>
</body>
</html>
